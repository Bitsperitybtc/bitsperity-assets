<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1600" height="560" fill="#FAF8F3"/>
<text x="800" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1C1B18">From idea to paid work</text>
<text x="800" y="108" text-anchor="middle" font-size="20" fill="#6B645A">Seven steps, all on open Nostr events and Lightning. No platform in between.</text>
<line x1="130" y1="260" x2="1470" y2="260" stroke="#D5A63C" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
<g text-anchor="middle">
<g transform="translate(130,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">1</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Idea</text><text y="134" font-size="17" fill="#4A453D">Say where you</text><text y="158" font-size="17" fill="#4A453D">are heading</text></g>
<g transform="translate(353,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3" stroke-dasharray="8 6"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">2</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Prompt Request</text><text y="134" font-size="17" fill="#4A453D">Optional: propose the</text><text y="158" font-size="17" fill="#4A453D">prompt, refine together</text></g>
<g transform="translate(577,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">3</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Jobs</text><text y="134" font-size="17" fill="#4A453D">Spec, definition</text><text y="158" font-size="17" fill="#4A453D">of done, price in sats</text></g>
<g transform="translate(800,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">4</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Offers</text><text y="134" font-size="17" fill="#4A453D">Private bids,</text><text y="158" font-size="17" fill="#4A453D">counter or accept</text></g>
<g transform="translate(1023,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">5</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Contract</text><text y="134" font-size="17" fill="#4A453D">Signed by both,</text><text y="158" font-size="17" fill="#4A453D">verifiable by anyone</text></g>
<g transform="translate(1247,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">6</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Settle</text><text y="134" font-size="17" fill="#4A453D">Lightning (NWC),</text><text y="158" font-size="17" fill="#4A453D">receipt with preimage</text></g>
<g transform="translate(1470,260)"><circle r="46" fill="#D5A63C" stroke="#8A6414" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#1C1B18">7</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Reputation</text><text y="134" font-size="17" fill="#4A453D">Paid contracts build</text><text y="158" font-size="17" fill="#4A453D">your public record</text></g>
</g><text x="800" y="500" text-anchor="middle" font-size="18" fill="#6B645A">Dashed step is optional. NIP-23 ideas &#183; NIP-99 jobs &#183; NIP-44 private offers &#183; NIP-46 signer &#183; NIP-47 payments</text></svg>