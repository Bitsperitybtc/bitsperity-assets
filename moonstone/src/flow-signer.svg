<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1600" height="560" fill="#FAF8F3"/>
<text x="800" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1C1B18">Keys stay on your node</text>
<text x="800" y="108" text-anchor="middle" font-size="20" fill="#6B645A">Moonstone is the NIP-46 signer for every app and agent that needs your pubkey — without exporting the key.</text>
<line x1="160" y1="260" x2="1440" y2="260" stroke="#D5A63C" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
<g text-anchor="middle">
<g transform="translate(160,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">1</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Identities</text><text y="134" font-size="17" fill="#4A453D">Create or import</text><text y="158" font-size="17" fill="#4A453D">keys on Umbrel</text></g>
<g transform="translate(480,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">2</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Pair an app</text><text y="134" font-size="17" fill="#4A453D">Approve once with</text><text y="158" font-size="17" fill="#4A453D">clear permissions</text></g>
<g transform="translate(800,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">3</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Sign &amp; encrypt</text><text y="134" font-size="17" fill="#4A453D">Events leave; the</text><text y="158" font-size="17" fill="#4A453D">secret never does</text></g>
<g transform="translate(1120,260)"><circle r="46" fill="#FBF1D6" stroke="#D5A63C" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#8A6414">4</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Agents (MCP)</text><text y="134" font-size="17" fill="#4A453D">Same grants for</text><text y="158" font-size="17" fill="#4A453D">Horizon &amp; tools</text></g>
<g transform="translate(1440,260)"><circle r="46" fill="#D5A63C" stroke="#8A6414" stroke-width="3"/><text y="14" font-size="40" font-weight="700" fill="#1C1B18">5</text><text y="100" font-size="24" font-weight="700" fill="#1C1B18">Revoke anytime</text><text y="134" font-size="17" fill="#4A453D">Per-app control in</text><text y="158" font-size="17" fill="#4A453D">the keyring UI</text></g>
</g>
<text x="800" y="500" text-anchor="middle" font-size="18" fill="#6B645A">NIP-46 remote signer &#183; NIP-44 encrypt/decrypt &#183; per-identity grants &#183; Umbrel self-host</text>
</svg>
