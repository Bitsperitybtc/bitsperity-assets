<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1600" height="560" fill="#171310"/>
  <text x="800" y="80" text-anchor="middle" font-size="34" font-weight="700" fill="#F1EBDF">Built on four promises</text>
  <g text-anchor="middle">
    <g transform="translate(40,140)"><rect width="350" height="340" rx="20" fill="#211B16" stroke="#F3C76A" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="175" cy="80" r="34" fill="none" stroke="#F3C76A" stroke-width="4"/><rect x="170" y="108" width="10" height="34" fill="#F3C76A"/><rect x="170" y="130" width="24" height="8" fill="#F3C76A"/>
      <text x="175" y="200" font-size="26" font-weight="700" fill="#F1EBDF">Keys stay local</text>
      <text x="175" y="244" font-size="18" fill="#C9C0B2">Private keys never leave</text><text x="175" y="270" font-size="18" fill="#C9C0B2">your Umbrel. Apps get</text><text x="175" y="296" font-size="18" fill="#C9C0B2">signatures, not secrets.</text></g>
    <g transform="translate(430,140)"><rect width="350" height="340" rx="20" fill="#211B16" stroke="#F3C76A" stroke-opacity=".5" stroke-width="2"/>
      <g stroke="#F3C76A" stroke-width="3" fill="none"><rect x="145" y="48" width="60" height="78" rx="8"/><circle cx="175" cy="88" r="10"/><path d="M175 98 V118"/></g>
      <text x="175" y="200" font-size="26" font-weight="700" fill="#F1EBDF">One keyring</text>
      <text x="175" y="244" font-size="18" fill="#C9C0B2">Many identities, one place</text><text x="175" y="270" font-size="18" fill="#C9C0B2">to unlock, pair, and see</text><text x="175" y="296" font-size="18" fill="#C9C0B2">which apps can sign.</text></g>
    <g transform="translate(820,140)"><rect width="350" height="340" rx="20" fill="#211B16" stroke="#F3C76A" stroke-opacity=".5" stroke-width="2"/>
      <g fill="none" stroke="#F3C76A" stroke-width="4" stroke-linecap="round"><path d="M150 70 H200"/><path d="M160 95 H210"/><path d="M150 120 H195"/><circle cx="220" cy="95" r="18"/></g>
      <text x="175" y="200" font-size="26" font-weight="700" fill="#F1EBDF">Explicit grants</text>
      <text x="175" y="244" font-size="18" fill="#C9C0B2">Approve an app once with</text><text x="175" y="270" font-size="18" fill="#C9C0B2">the perms it needs. Revoke</text><text x="175" y="296" font-size="18" fill="#C9C0B2">it the moment you want.</text></g>
    <g transform="translate(1210,140)"><rect width="350" height="340" rx="20" fill="#211B16" stroke="#F3C76A" stroke-opacity=".5" stroke-width="2"/>
      <g stroke="#F3C76A" stroke-width="3" fill="#171310"><line x1="140" y1="70" x2="210" y2="50"/><line x1="210" y1="50" x2="225" y2="105"/><line x1="140" y1="70" x2="130" y2="115"/><line x1="130" y1="115" x2="225" y2="105"/><circle cx="140" cy="70" r="10"/><circle cx="210" cy="50" r="10"/><circle cx="225" cy="105" r="10"/><circle cx="130" cy="115" r="10"/></g>
      <text x="175" y="200" font-size="26" font-weight="700" fill="#F1EBDF">Agents welcome</text>
      <text x="175" y="244" font-size="18" fill="#C9C0B2">MCP clients use the same</text><text x="175" y="270" font-size="18" fill="#C9C0B2">signer path as Horizon —</text><text x="175" y="296" font-size="18" fill="#C9C0B2">no keys in the agent.</text></g>
  </g>
</svg>
